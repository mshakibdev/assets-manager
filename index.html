<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Assets Manager</title>
        <style>
            html,
            body {
                font-family: Arial, sans-serif;
                padding: 10px;
                width: 600px;
                height: 600px;
            }

            pre {
                white-space: pre-wrap;
                word-wrap: break-word;
            }

            #imagesTableBody {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                margin-top: 12px;
            }

            .img-item {
                position: relative;
                background: #f8f8f8;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
                text-align: center;
                padding-bottom: 18px;
            }

            .img-item img {
                width: 100%;
                height: auto;
                max-height: 120px;
                object-fit: cover;
                display: block;
            }

            .img-label {
                position: absolute;
                bottom: 34px;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.64);
                color: #fff;
                font-size: 13px;
                padding: 4px 2px;
                text-align: center;
                z-index: 2;
                white-space: pre-line;
            }

            .download-btn {
                position: absolute;
                bottom: 6px;
                left: 50%;
                transform: translateX(-50%);
                background: #4caf50;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 12px;
                padding: 3px 14px;
                cursor: pointer;
                z-index: 3;
                transition: background 0.2s;
            }

            .copy-btn {
                bottom: 6px;
                left: 50%;
                background: #4caf50;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 12px;
                cursor: pointer;
                z-index: 3;
                transition: background 0.2s;
            }

            .download-btn:hover {
                background: #357a38;
            }

            /* Tab bar */
            .tabs {
                display: flex;
                border-bottom: 1px solid #ccc;
                margin-bottom: 8px;
            }

            .tab-btn {
                flex: 1;
                padding: 6px;
                background: #f9f9f9;
                border: none;
                border-bottom: 2px solid transparent;
                cursor: pointer;
                font-weight: bold;
            }

            .tab-btn.active {
                border-bottom-color: #4caf50;
                background: #fff;
            }

            /* Tab content */
            .tab-content {
                display: none;
            }

            .tab-content.active {
                display: block;
            }

        </style>
        <script src="./dist/jszip.js"></script>
        <script src="./dist/jszip.min.js"></script>
    </head>

    <body>
        <!-- Tab buttons -->
        <div class="tabs">
            <button id="tab-overview-btn" class="tab-btn active">Overview</button>
            <button id="tab-images-btn" class="tab-btn">Images</button>
            <button id="tab-svg-btn" class="tab-btn">SVG</button>
        </div>

        <!-- Overview tab content -->
        <div id="overviewTab" class="tab-content active">
            <button id="fetchData">Fetch Images</button>
            <div class="controls">
                <label>
                    File Type:
                    <select id="fileTypeFilter">
                        <option value="all">All</option>
                        <option value="jpg">JPG/JPEG</option>
                        <option value="png">PNG</option>
                        <option value="gif">GIF</option>
                        <option value="webp">WEBP</option>
                        <option value="svg">SVG</option>
                    </select>
                </label>
                <label>
                    Sort by Size:
                    <select id="sortOrder">
                        <option value="desc">Largest First</option>
                        <option value="asc">Smallest First</option>
                    </select>
                </label>
            </div>

            <button id="downloadZipBtn">Download All as ZIP</button>

            <div class="table-container">
                <table id="imagesTable">
                    <thead>
                        <tr>
                            <th>Preview</th>
                        </tr>
                    </thead>
                    <tbody id="imagesTableBody">
                        <tr>
                            <td colspan="5" style="text-align:center; padding:10px;">
                                No images fetched yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <template id="image-row-template">
                <tr>
                    <td class="preview-cell">
                        <div class="img-preview">
                            <img />
                            <div class="overlay"></div>
                        </div>
                    </td>
                    <td class="alt-cell"></td>
                    <td class="title-cell"></td>
                    <td class="size-cell"></td>
                    <td class="download-cell">
                        <button class="download-btn">Download</button>
                    </td>
                </tr>
            </template>
        </div>

        <!-- Images tab content -->
        <div id="imagesTab" class="tab-content">
            <h4>Image Meta Tag</h4>
            <table id="imagesTable-2" style="width: 100%; border-collapse: collapse; margin-top: 12px;">
                <thead style="background: #f0f0f0; text-align: left;">
                    <tr>
                        <th style="padding: 8px; border-bottom: 1px solid #ddd;">Preview</th>
                        <th style="padding: 8px; border-bottom: 1px solid #ddd;">Alt attribute</th>
                        <th style="padding: 8px; border-bottom: 1px solid #ddd;">Title attribute</th>
                        <th style="padding: 8px; border-bottom: 1px solid #ddd;">Size</th>
                    </tr>
                </thead>
                <tbody id="imagesTableBody-2">
                    <!-- rows will be dynamically inserted here -->
                </tbody>
            </table>

        </div>

        <!--SVG tab-->
        <div id="svgTab" class="tab-content">
            <h4>Inline SVGs</h4>
            <table id="svgTable" style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Preview</th>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Code</th>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Copy</th>
                    </tr>
                </thead>
                <tbody id="svgTableBody">
                    <tr>
                        <td colspan="3" style="text-align:center;padding:10px;">No SVGs yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="popup.js"></script>
    </body>

</html>
