<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Assets Manager</title>
        <link rel="stylesheet" href="./styles.css">
        <script src="./dist/jszip.js"></script>
        <script src="./dist/jszip.min.js"></script>
        <script src="./dist/dropdown.js"></script>
    </head>

    <body>
        <div class="btn-container">
            <!-- Tab buttons -->
            <div class="tabs">
                <button id="tab-overview-btn" class="tab-btn active">All Images</button>
                <button id="tab-images-btn" class="tab-btn">Images Meta Info</button>
                <button id="tab-svg-btn" class="tab-btn">SVG</button>
            </div>

            <!-- Overview tab content -->
            <div id="overviewTab" class="tab-content active">
                <div class="controls">
                    <label>
                        <select class="custom-select" id="fileTypeFilter">
                            <option class="option" value="all">All</option>
                            <option value="jpg">JPG/JPEG</option>
                            <option value="png">PNG</option>
                            <option value="gif">GIF</option>
                            <option value="webp">WEBP</option>
                            <option value="svg">SVG</option>
                        </select>

                    </label>
                    <label>
                        <select class="custom-select" id="sortOrder">
                            <option value="desc">Largest First</option>
                            <option value="asc">Smallest First</option>
                        </select>
                    </label>
                </div>

                <button id="downloadZipBtn" class="download-zip-btn ">Download All as ZIP</button>
                <div class="view-toggle">
                    <button id="viewGridBtn" class="view-btn active">Grid View</button>
                    <button id="viewListBtn" class="view-btn">List View</button>
                </div>
                <div class="table-container">
                    <table id="imagesTable">
                        <tbody id="imagesTableBody">
                            <tr>
                                <td colspan="5" style="text-align:center; padding:10px;">
                                    No images fetched yet.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <template id="image-row-template">
            <tr>
                <td class="preview-cell">
                    <div class="img-preview">
                        <img />
                        <div class="overlay"></div>
                    </div>
                </td>
                <td class="alt-cell"></td>
                <td class="title-cell"></td>
                <td class="size-cell"></td>
                <td class="download-cell">
                    <button class="download-btn">Download</button>
                </td>
            </tr>
        </template>

        <div class="content-container">
            <!-- Images tab content -->
            <div id="imagesTab" class="tab-content">
                <h1>Images</h1>
                <table id="imagesTable-2">
                    <thead>
                        <tr>
                            <th>Preview</th>
                            <th>Alt attribute</th>
                            <th>Title attribute</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody id="imagesTableBody-2">
                        <!-- rows will be dynamically inserted here -->
                    </tbody>
                </table>

            </div>

            <!--SVG tab-->
            <!-- popup.html -->
            <div id="svgTab" class="tab-content">
                <h1>Inline SVGs</h1>
                <div id="svgGrid">Loading SVGs…</div>
            </div>
            <div>

                <script src="popup.js"></script>
    </body>

</html>
