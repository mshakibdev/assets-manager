<!DOCTYPE html>
<html lang="en">
<head>
    <title>Meta Data & URL</title>
    <style>
        body { font-family: Arial, sans-serif; min-width: 320px; padding: 10px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .img-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 12px;
        }
        .img-item {
            position: relative;
            background: #f8f8f8;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            text-align: center;
            padding-bottom: 18px;
        }
        .img-item img {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: cover;
            display: block;
        }
        .img-label {
            position: absolute;
            bottom: 34px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.64);
            color: #fff;
            font-size: 13px;
            padding: 4px 2px;
            text-align: center;
            z-index: 2;
            white-space: pre-line;
        }
        .download-btn {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            padding: 3px 14px;
            cursor: pointer;
            z-index: 3;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #357a38; }
    </style>
    <script src="./dist/jszip.js"></script>
    <script src="./dist/jszip.min.js"></script>
</head>
<body>
<h3>Image assets fetch</h3>

<button id="fetchData">Fetch Image !</button>
<pre id="result"></pre>
<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
    <label>
        File Type:
        <select id="fileTypeFilter">
            <option value="all">All</option>
            <option value="jpg">JPG/JPEG</option>
            <option value="png">PNG</option>
            <option value="gif">GIF</option>
            <option value="webp">WEBP</option>
            <option value="svg">SVG</option>
        </select>
    </label>
    <label>
        Sort by Size:
        <select id="sortOrder">
            <option value="desc">Largest First</option>
            <option value="asc">Smallest First</option>
        </select>
    </label>
</div>
<button id="downloadZipBtn">Download All as ZIP</button>
<div id="images" class="img-grid"></div>
<script src="popup.js"></script>
</body>
</html>
